# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - kmr_iiwa_A1
      - kmr_iiwa_A2
      - kmr_iiwa_A3
      - kmr_iiwa_A4
      - kmr_iiwa_A5
      - kmr_iiwa_A6
      - kmr_iiwa_A7
    command_interfaces:
      - position
    state_interfaces:
      - position
    allow_nonzero_velocity_at_trajectory_end: true
